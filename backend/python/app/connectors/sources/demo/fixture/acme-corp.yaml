- id: drive-billing-resilience
  container: drive-engineering
  type: FILE
  title: Nota simulata 08 — Ipotesi illuminazione + Coordinamento impianti — Villa Aurora
  author: dana
  created: &id002 2026-02-13 00:07:00+00:00
  updated: *id002
  web_url: https://docs.acme-demo.example/demo/records/drive-billing-resilience
  body: Appunto di coordinamento simulato. Si propone di valutare luce funzionale sul piano e luce ambientale sulla
    penisola, coordinandosi con l’impianto elettrico; non risultano prodotti selezionati o approvati. La posizione
    degli attacchi acqua ed elettricità va confrontata sul posto con cucina ed elettrodomestici; gli appunti non
    sono esecutivi. Verificare lo stato usando D15, D16; nessuna approvazione ulteriore è implicita. Nota sintetica
    di lavoro inventata per la demo, non documento cliente originale.
- id: gh-pr-482
  container: gh-svc-billing-worker
  type: PULL_REQUEST
  title: Scheda tecnica simulata 09 — Manutenzione indicativa + Brief iniziale + Uso della penisola — Villa Aurora
  author: priya
  created: &id003 2026-02-19 00:08:00+00:00
  updated: *id003
  web_url: https://github.acme-demo.example/demo/records/gh-pr-482
  relations:
  - type: RELATED
    to: jira-inc-2031
  - type: RELATED
    to: drive-billing-resilience
  body: 'Scambio demo simulato. La nota suggerisce panno morbido e istruzioni del materiale effettivamente scelto;
    materiale del piano e istruzioni definitive saranno specificati dopo la scelta. Giulia Ferri richiede ante in
    rovere e piano bianco, contenimento per stoviglie e una zona di preparazione libera; desidera una penisola e
    arredi coordinati con il living. La penisola è prevista come punto di preparazione e incontro; ingombri, passaggi
    e interferenze impiantistiche vanno confermati dopo il rilievo. Riferimento documentale: D20, D01, D08. Scheda
    tecnica simulata per organizzare i punti emersi; non rappresenta una modifica implementata o un via libera alla
    produzione.'
