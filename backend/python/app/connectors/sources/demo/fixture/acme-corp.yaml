  body: Promemoria demo simulato. Il preventivo originale, illustrativo e IVA esclusa, riporta €12.000 mobili, €4.000
    piano e €2.000 installazione, per un totale di €18.000; non autorizza l’ordine. La scheda materiali propone
    inizialmente ante in rovere e piano bianco; aspetto e texture vanno verificati su campioni fisici e la scheda
    non registra un ordine. La nota riassume soltanto quanto riportato in D02, D11. Commento simulato a fini dimostrativi;
    non è una revisione o approvazione reale.
