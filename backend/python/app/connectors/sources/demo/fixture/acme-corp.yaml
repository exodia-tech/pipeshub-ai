- id: mobart-001-d01
  container: drive-villa-aurora
  type: FILE
  title: D01 — Brief iniziale — Villa Aurora — 2026-02-02
  author: marcus
  created: 2026-02-02 09:00:00+00:00
  body: 'Dati sintetici dimostrativi. Villa Aurora, progetto MB-DEMO-001, cucina MB-DEMO-001-K01. Giulia Ferri richiede
    ante in rovere e piano di lavoro bianco, contenimento per stoviglie e zona di preparazione libera. Cucina aperta
    sulla zona giorno; desidera una penisola e arredi coordinati, con carattere caldo e contemporaneo. Richiesta
    iniziale, non approvazione di ordine.

    '
- id: mobart-001-d02
  container: drive-villa-aurora
  type: FILE
  title: D02 — Preventivo originale — Villa Aurora — 2026-02-05
  author: priya
  created: 2026-02-05 09:00:00+00:00
  body: 'Dati sintetici dimostrativi. Proposta iniziale: mobili con ante in rovere e piano bianco. Importi illustrativi,
    IVA esclusa: mobili €12.000; piano €4.000; installazione €2.000; totale €18.000. Preventivo originale, non autorizza
    l''ordine e non è il prezzo di una variante successiva.

    '
- id: mobart-001-d03
  container: drive-villa-aurora
  type: FILE
  title: D03 — Richiesta variante ante — Villa Aurora — 2026-02-09
  author: alice
  created: 2026-02-09 09:00:00+00:00
  body: 'Dati sintetici dimostrativi. Giulia Ferri chiede di sostituire il rovere con il noce per le ante della
    cucina MB-DEMO-001-K01 e domanda di verificare l''eventuale revisione economica. È una richiesta, non un''approvazione
    del prezzo.

    '
- id: mobart-001-d04
  container: drive-villa-aurora
  type: FILE
  title: D04 — Approvazione finitura ante — Villa Aurora — 2026-02-11
  author: alice
  created: 2026-02-11 09:00:00+00:00
  body: 'Dati sintetici dimostrativi. Giulia Ferri approva esplicitamente le ante in noce al posto del rovere e
    conferma che il piano resta bianco. L''approvazione riguarda le finiture soltanto: non approva una variazione
    di prezzo e non autorizza l''ordine.

    '
- id: mobart-001-d05
  container: drive-villa-aurora
  type: FILE
  title: D05 — Verbale riunione, piano nero non approvato — Villa Aurora — 2026-02-16
  author: marcus
  created: 2026-02-16 09:00:00+00:00
  body: 'Dati sintetici dimostrativi. Giulia Ferri, Marco Riva ed Elena Conti discutono l''ipotesi di un piano nero.
    Giulia non approva l''opzione durante la riunione; occorre un suo riscontro successivo. Verificare le preferenze
    e aggiornare la proposta economica dopo la definizione delle finiture.

    '
- id: mobart-001-d06
  container: drive-villa-aurora
  type: FILE
  title: D06 — Checklist progetto e attività aperte — Villa Aurora — 2026-02-18
  author: marcus
  created: 2026-02-18 09:00:00+00:00
  body: 'Dati sintetici dimostrativi. Attività aperte: chiarire se mantenere il piano bianco o richiedere il nero;
    preparare e sottoporre un preventivo revisionato. Importo revisionato e relativa approvazione non disponibili.
    Nessuna autorizzazione all''ordine registrata. Marco raccoglie il riscontro; Elena preparerà la proposta aggiornata.

    '
- id: mobart-001-d08
  container: drive-villa-aurora
  type: FILE
  title: D08 — Scheda ambiente — Villa Aurora — 2026-02-03
  author: marcus
  created: 2026-02-03 09:00:00+00:00
  body: 'Dati sintetici dimostrativi. Cucina collegata alla zona giorno; penisola prevista come area di preparazione
    e incontro. Ingombri, passaggi e interferenze impiantistiche da confermare dopo il rilievo. Nessuna misura è
    esecutiva.

    '
