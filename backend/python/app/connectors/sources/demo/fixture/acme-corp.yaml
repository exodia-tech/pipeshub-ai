- id: gh-pr-211
  container: gh-svc-export
  type: PULL_REQUEST
  title: Scheda tecnica simulata 24 — Conferma delle finiture + Riscontro interno variante + Ipotesi illuminazione
    — Villa Aurora
  author: alice
  created: &id009 2026-02-11 00:23:00+00:00
  updated: *id009
  web_url: https://github.acme-demo.example/demo/records/gh-pr-211
  relations:
  - type: IMPLEMENTS
    to: gh-issue-207
  - type: RELATED
    to: drive-export-runbook
  body: Appunto di coordinamento simulato. Giulia Ferri approva le ante in noce al posto del rovere e conferma il
    piano bianco. L’approvazione riguarda le finiture, non il prezzo e non l’emissione dell’ordine. La finitura
    noce delle ante è confermata dalla cliente; la revisione economica deve ancora essere predisposta. Non risultano
    prezzo revisionato approvato né ordine. Si propone di valutare luce funzionale sul piano e luce ambientale sulla
    penisola, coordinandosi con l’impianto elettrico; non risultano prodotti selezionati o approvati. Verificare
    lo stato usando D04, D14, D15; nessuna approvazione ulteriore è implicita. Scheda tecnica simulata per organizzare
    i punti emersi; non rappresenta una modifica implementata o un via libera alla produzione.
