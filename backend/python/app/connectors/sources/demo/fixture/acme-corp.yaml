  created: 2026-02-16 00:10:00+00:00
  parent: gh-pr-482
  body: 'Contesto sintetico simulato per la demo. Durante la riunione si è discusso un possibile piano nero; Giulia
    non lo ha approvato e occorre un suo riscontro successivo. Il piano bianco è confermato nell’email dell’11 febbraio;
    quello nero è un’alternativa discussa ma non approvata. Non è disponibile un importo di variante. Fonte di riferimento:
    D05, D17; non aggiunge decisioni o importi. Commento simulato a fini dimostrativi; non è una revisione o approvazione
    reale.'
