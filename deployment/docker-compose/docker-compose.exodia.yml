services:
  pipeshub-ai:
    image: exodia-pipeshub:50be81e21a0b6646c1e6d7cca1a161e27e9aa8a4
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: '1'
        PYTHON_DEPS_IMAGE: pipeshubai/pipeshub-ai-base@sha256:41c49c1fe8eb1a0130137aab7e69485fadd36d24dbaff5118ea354fa3159ec59
        RUNTIME_BASE_IMAGE: pipeshubai/pipeshub-ai-base@sha256:3e9f579df07adc6150bd389de8373dd4038a725626942001d41c640dd1279fc2
      shm_size: 4gb
      ulimits:
        memlock:
          soft: -1
          hard: -1
    deploy:
      resources:
        limits:
          memory: ${APP_MEMORY_LIMIT:-10G}
          cpus: '4'
    memswap_limit: ${APP_MEMSWAP_LIMIT:-16G}
    shm_size: 2gb
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    init: true
    entrypoint:
    - /bin/sh
    - -c
    - "python3 -c 'import json, os, pathlib, time, urllib.request, urllib.error\norigin = '\"'\"'http://127.0.0.1:3000'\"\
      '\"'\nemail = os.environ['\"'\"'EXODIA_ADMIN_EMAIL'\"'\"']\npassword = os.environ['\"'\"'EXODIA_ADMIN_PASSWORD'\"'\"\
      ']\ndef request(path, data=None, session=None):\n    headers = {'\"'\"'Content-Type'\"'\"': '\"'\"'application/json'\"\
      '\"'}\n    if session: headers['\"'\"'x-session-token'\"'\"'] = session\n    req = urllib.request.Request(origin + path,\
      \ headers=headers, data=json.dumps(data).encode() if data is not None else None)\n    with urllib.request.urlopen(req,\
      \ timeout=20) as response:\n        body = json.load(response)\n        return body, response.headers\nfor attempt in\
      \ range(120):\n    try:\n        status, _ = request('\"'\"'/api/v1/org/exists'\"'\"')\n        if status.get('\"'\"\
      'exists'\"'\"') is False:\n            request('\"'\"'/api/v1/org'\"'\"', {'\"'\"'accountType'\"'\"':'\"'\"'business'\"\
      '\"','\"'\"'contactEmail'\"'\"':email,'\"'\"'adminFullName'\"'\"':'\"'\"'EXODIA Administrator'\"'\"','\"'\"'password'\"\
      '\"':password,'\"'\"'registeredName'\"'\"':'\"'\"'EXODIA'\"'\"'})\n        _, headers = request('\"'\"'/api/v1/userAccount/initAuth'\"\
      '\"', {'\"'\"'email'\"'\"':email})\n        session = headers.get('\"'\"'x-session-token'\"'\"')\n        if not session:\
      \ raise RuntimeError('\"'\"'missing session'\"'\"')\n        auth, _ = request('\"'\"'/api/v1/userAccount/authenticate'\"\
      '\"', {'\"'\"'method'\"'\"':'\"'\"'password'\"'\"','\"'\"'email'\"'\"':email,'\"'\"'credentials'\"'\"':{'\"'\"'password'\"\
      '\"':password}}, session)\n        if not auth.get('\"'\"'accessToken'\"'\"'): raise RuntimeError('\"'\"'login failed'\"\
      '\"')\n        pathlib.Path('\"'\"'/tmp/exodia-admin-ready'\"'\"').touch()\n        print('\"'\"'EXODIA admin initialized\
      \ and password login verified'\"'\"', flush=True)\n        break\n    except Exception:\n        time.sleep(10)\nelse:\n\
      \    print('\"'\"'EXODIA admin initialization failed; public readiness remains blocked'\"'\"', flush=True)\n' & for\
      \ k in MAX_CONCURRENT_PARSING MAX_CONCURRENT_INDEXING MAX_PENDING_INDEXING_TASKS EMBEDDING_SERVER_MAX_CONCURRENCY EMBEDDING_BATCH_CONCURRENCY;\
      \ do v=$$(printenv \"$$k\" || true); [ -z \"$$v\" ] && unset \"$$k\"; done; if [ -x /usr/local/bin/docker-entrypoint.sh\
      \ ]; then exec /usr/local/bin/docker-entrypoint.sh /app/process_monitor.sh; else exec /app/process_monitor.sh; fi"
    logging:
      driver: local
      options:
        max-size: ${LOG_MAX_SIZE:-20m}
        max-file: ${LOG_MAX_FILE:-15}
        compress: 'true'
    environment:
    - NODE_ENV=${NODE_ENV:-production}
    - LOG_LEVEL=${LOG_LEVEL:-info}
    - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
    - WEB_CONNECTOR_ALLOWED_HOSTS=${WEB_CONNECTOR_ALLOWED_HOSTS:-}
    - PIPESHUB_BLOCK_PRIVATE_ADDRESSES=${PIPESHUB_BLOCK_PRIVATE_ADDRESSES:-}
    - STRICT_MODE=${STRICT_MODE:-false}
    - SKIP_DOMAIN_CHECK=${SKIP_DOMAIN_CHECK:-false}
    - SAML_SP_ENTITY_ID=${SAML_SP_ENTITY_ID:-}
    - SECRET_KEY=${SECRET_KEY:-}
    - JWT_SECRET=${JWT_SECRET:-}
    - SCOPED_JWT_SECRET=${SCOPED_JWT_SECRET:-}
    - COOKIE_SECRET=${COOKIE_SECRET:-}
    - ROTATE_SIGNING_SECRETS=${ROTATE_SIGNING_SECRETS:-}
    - FRONTEND_PUBLIC_URL=${FRONTEND_PUBLIC_URL:-}
    - QUERY_BACKEND=http://localhost:8000
    - CONNECTOR_BACKEND=http://localhost:8088
    - INDEXING_BACKEND=http://localhost:8091
    - EMBEDDING_SERVER_URL=http://localhost:8002
    - DATA_STORE=${DATA_STORE:-neo4j}
    - ARANGO_URL=http://arango:8529
    - ARANGO_DB_NAME=${ARANGO_DB_NAME:-es}
    - ARANGO_USERNAME=${ARANGO_USERNAME:-root}
    - ARANGO_PASSWORD=${ARANGO_PASSWORD:-}
    - NEO4J_URI=bolt://neo4j:7687
    - NEO4J_USERNAME=${NEO4J_USERNAME:-neo4j}
    - NEO4J_PASSWORD=${NEO4J_PASSWORD:-}
    - NEO4J_DATABASE=${NEO4J_DATABASE:-neo4j}
    - KV_STORE_TYPE=${KV_STORE_TYPE:-redis}
    - ETCD_URL=http://etcd:2379
    - ETCD_HOST=etcd
    - ETCD_TIMEOUT=${ETCD_TIMEOUT:-5000}
    - MESSAGE_BROKER=${MESSAGE_BROKER:-redis}
    - REDIS_STREAMS_MAXLEN=${REDIS_STREAMS_MAXLEN:-500000}
    - KAFKA_BROKERS=${KAFKA_BROKERS:-kafka-1:9092}
    - KAFKA_SSL=${KAFKA_SSL:-false}
    - KAFKA_USERNAME=${KAFKA_USERNAME:-}
    - KAFKA_PASSWORD=${KAFKA_PASSWORD:-}
    - KAFKA_SASL_MECHANISM=${KAFKA_SASL_MECHANISM:-}
    - REDIS_HOST=${REDIS_HOST:-redis}
    - REDIS_PORT=${REDIS_PORT:-6379}
    - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    - REDIS_USERNAME=${REDIS_USERNAME:-}
    - REDIS_URL=redis://:${REDIS_PASSWORD:-}@${REDIS_HOST:-redis}:${REDIS_PORT:-6379}
    - REDIS_KV_PREFIX=${REDIS_KV_PREFIX:-pipeshub:kv:}
    - REDIS_TIMEOUT=${REDIS_TIMEOUT:-10000}
    - REDIS_DB=${REDIS_DB:-0}
    - REDIS_KEY_NAMESPACE=${REDIS_KEY_NAMESPACE:-}
    - REDIS_MODE=${REDIS_MODE:-standalone}
    - REDIS_CLUSTER_ENDPOINTS=${REDIS_CLUSTER_ENDPOINTS:-}
    - REDIS_CLUSTER_SCALE_READS=${REDIS_CLUSTER_SCALE_READS:-master}
    - REDIS_CLUSTER_NAT_MAP=${REDIS_CLUSTER_NAT_MAP:-}
    - REDIS_PROVIDER_MODULE=${REDIS_PROVIDER_MODULE:-}
    - REDIS_TLS_ENABLED=${REDIS_TLS_ENABLED:-false}
    - REDIS_TLS_REJECT_UNAUTHORIZED=${REDIS_TLS_REJECT_UNAUTHORIZED:-true}
    - REDIS_TLS_CA_PATH=${REDIS_TLS_CA_PATH:-}
    - CELERY_BROKER_URL=${CELERY_BROKER_URL:-}
    - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-}
    - MONGO_URI=mongodb://${MONGO_USERNAME:-admin}:${MONGO_PASSWORD:-}@mongodb:27017/?authSource=admin
    - MONGO_DB_NAME=${MONGO_DB_NAME:-es}
    - REPLICA_SET_AVAILABLE=false
    - QDRANT_API_KEY=${QDRANT_API_KEY:-}
    - QDRANT_HOST=qdrant
    - QDRANT_GRPC_PORT=6334
    - QDRANT_PORT=6333
    - OLLAMA_API_URL=http://host.docker.internal:11434
    - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
    - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
    - AWS_REGION=${AWS_REGION:-}
    - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-}
    - MAX_REQUESTS_PER_MINUTE=${MAX_REQUESTS_PER_MINUTE:-2000}
    - MAX_OAUTH_CLIENT_REQUESTS_PER_MINUTE=${MAX_OAUTH_CLIENT_REQUESTS_PER_MINUTE:-1000}
    - MAX_AUTH_REQUESTS_PER_MINUTE=${MAX_AUTH_REQUESTS_PER_MINUTE:-10}
    - TRUST_PROXY=${TRUST_PROXY:-}
    - HIDE_SECRET_CONFIG=${HIDE_SECRET_CONFIG:-true}
    - MCP_SCOPES=${MCP_SCOPES:-openid,profile,email,offline_access,semantic:write,conversation:write,conversation:chat,kb:read,team:read,user:read,config:read,agent:read,agent:execute,connector:read}
    - ACCESS_TOKEN_EXPIRY=${ACCESS_TOKEN_EXPIRY:-24h}
    - REFRESH_TOKEN_EXPIRY=${REFRESH_TOKEN_EXPIRY:-720h}
    - PASSWORD_RESET_LINK_EXPIRY=${PASSWORD_RESET_LINK_EXPIRY:-20m}
    - PIPESHUB_ENABLE_DCR=${PIPESHUB_ENABLE_DCR:-}
    - PIPESHUB_ENABLE_DEVICE_GRANT=${PIPESHUB_ENABLE_DEVICE_GRANT:-}
    - OMP_NUM_THREADS=${OMP_NUM_THREADS:-2}
    - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-}
    - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-}
    - MAX_CONCURRENT_PARSING=${MAX_CONCURRENT_PARSING:-}
    - MAX_CONCURRENT_INDEXING=${MAX_CONCURRENT_INDEXING:-}
    - GOVERNOR_HEAVY_PARSE_SLOTS_PER_CPU=${GOVERNOR_HEAVY_PARSE_SLOTS_PER_CPU:-}
    - GOVERNOR_LIGHT_PARSE_SLOTS_PER_CPU=${GOVERNOR_LIGHT_PARSE_SLOTS_PER_CPU:-}
    - INDEXING_SPLIT_LEASE_POOLS=${INDEXING_SPLIT_LEASE_POOLS:-}
    - GOVERNOR_LIGHT_PARSE_MAX=${GOVERNOR_LIGHT_PARSE_MAX:-}
    - GOVERNOR_INDEX_HEADROOM=${GOVERNOR_INDEX_HEADROOM:-}
    - GOVERNOR_INDEX_MAX=${GOVERNOR_INDEX_MAX:-}
    - GOVERNOR_INDEX_HEAVY_WORKING_SET_GB=${GOVERNOR_INDEX_HEAVY_WORKING_SET_GB:-}
    - GOVERNOR_INDEX_LIGHT_WORKING_SET_GB=${GOVERNOR_INDEX_LIGHT_WORKING_SET_GB:-}
    - GOVERNOR_HEAVY_PARSE_WORKING_SET_GB=${GOVERNOR_HEAVY_PARSE_WORKING_SET_GB:-}
    - GOVERNOR_BASELINE_MEMORY_MB=${GOVERNOR_BASELINE_MEMORY_MB:-}
    - MAX_PENDING_INDEXING_TASKS=${MAX_PENDING_INDEXING_TASKS:-}
    - QUERY_UVICORN_WORKERS=${QUERY_UVICORN_WORKERS:-}
    - PIPESHUB_AGENT_TRANSPORT=${PIPESHUB_AGENT_TRANSPORT:-langchain}
    - PIPESHUB_ACCESSIBLE_RECORDS_CACHE=${PIPESHUB_ACCESSIBLE_RECORDS_CACHE:-}
    - PIPESHUB_ACCESSIBLE_RECORDS_CACHE_TTL=${PIPESHUB_ACCESSIBLE_RECORDS_CACHE_TTL:-300}
    - PIPESHUB_SIGNED_URL_CACHE_SECONDS=${PIPESHUB_SIGNED_URL_CACHE_SECONDS:-0}
    - BLOB_STORAGE_COMPRESSION=${BLOB_STORAGE_COMPRESSION:-false}
    - INDEXING_UVICORN_WORKERS=${INDEXING_UVICORN_WORKERS:-1}
    - PARSING_UVICORN_WORKERS=${PARSING_UVICORN_WORKERS:-1}
    - DOCLING_UVICORN_WORKERS=${DOCLING_UVICORN_WORKERS:-1}
    - CONNECTOR_UVICORN_WORKERS=${CONNECTOR_UVICORN_WORKERS:-1}
    - LOCAL_DOCLING_PARSE_WORKERS=${LOCAL_DOCLING_PARSE_WORKERS:-1}
    - PDF_OCR_DETECTION_WORKERS=${PDF_OCR_DETECTION_WORKERS:-1}
    - CONNECTOR_SYNC_MAX_CONCURRENT=${CONNECTOR_SYNC_MAX_CONCURRENT:-8}
    - CONNECTOR_SYNC_DELETE_STOP_WAIT_SEC=${CONNECTOR_SYNC_DELETE_STOP_WAIT_SEC:-15}
    - MAX_TABLE_ROWS_FOR_LLM=${MAX_TABLE_ROWS_FOR_LLM:-1000}
    - EXCEL_MAX_TABLE_ROWS_TO_INDEX=${EXCEL_MAX_TABLE_ROWS_TO_INDEX:-20000}
    - EXCEL_HEADER_GENERATION_SAMPLE_SCAN_LIMIT=${EXCEL_HEADER_GENERATION_SAMPLE_SCAN_LIMIT:-500}
    - EMBEDDING_SERVER_ALLOW_REMOTE_CODE=${EMBEDDING_SERVER_ALLOW_REMOTE_CODE:-false}
    - EMBEDDING_SERVER_MAX_CONCURRENCY=${EMBEDDING_SERVER_MAX_CONCURRENCY:-}
    - EMBEDDING_BATCH_CONCURRENCY=${EMBEDDING_BATCH_CONCURRENCY:-}
    - EMBED_SENTENCE_MIN_WORDS=${EMBED_SENTENCE_MIN_WORDS:-100}
    - SLACK_SIGNING_SECRET=${SLACK_SIGNING_SECRET:-}
    - BOT_TOKEN=${BOT_TOKEN:-}
    - SLACK_BOT_PORT=${SLACK_BOT_PORT:-3020}
    - OPIK_API_KEY=${OPIK_API_KEY:-}
    - OPIK_WORKSPACE=${OPIK_WORKSPACE:-}
    - SANDBOX_MODE=${SANDBOX_MODE:-docker}
    - SANDBOX_ALLOW_LOCAL=${SANDBOX_ALLOW_LOCAL:-false}
    - SANDBOX_ALLOW_NETWORK=${SANDBOX_ALLOW_NETWORK:-false}
    - SANDBOX_EGRESS_ALLOW_CIDRS=${SANDBOX_EGRESS_ALLOW_CIDRS:-}
    - SANDBOX_DISK_QUOTA=${SANDBOX_DISK_QUOTA:-10g}
    - SANDBOX_DOCKER_IMAGE=${SANDBOX_DOCKER_IMAGE:-pipeshubai/pipeshub-sandbox:${IMAGE_TAG:-latest}}
    - SANDBOX_EGRESS_NETWORK=${SANDBOX_EGRESS_NETWORK:-pipeshub_sandbox_egress}
    - DOCKER_HOST=tcp://docker-socket-proxy:2375
    - PIPESHUB_SKIP_SLACKBOT=${PIPESHUB_SKIP_SLACKBOT:-false}
    - PARSING_SERVICE_URL=http://localhost:8092
    - EXTRACTION_SERVICE_URL=http://localhost:8093
    - USE_PARSING_SERVICE=${USE_PARSING_SERVICE:-false}
    - DEFER_EXTRACTION=${DEFER_EXTRACTION:-false}
    - VECTOR_COLLECTION_STRATEGY=${VECTOR_COLLECTION_STRATEGY:-single}
    - EXODIA_ADMIN_EMAIL=${EXODIA_ADMIN_EMAIL:-}
    - EXODIA_ADMIN_PASSWORD=${EXODIA_ADMIN_PASSWORD:-}
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      neo4j:
        condition: service_healthy
        required: false
    security_opt:
    - no-new-privileges:true
    volumes:
    - pipeshub_data:/data/pipeshub
    - pipeshub_root_local:/root/.local
    - pipeshub_hf_cache:/root/.cache/huggingface
    networks:
    - pipeshub
    healthcheck:
      test:
      - CMD-SHELL
      - 'test -f /tmp/exodia-admin-ready && curl -sf http://localhost:3000/api/v1/health/services -o /tmp/hc.json && python3
        -c "import json,sys; d=json.load(open(''/tmp/hc.json'')); s=d.get(''services'',{}) or {}; required=(''query'',''connector'',''indexing'',''docling'');
        sys.exit(0 if all(s.get(k)==''healthy'' for k in required) else 1)"

        '
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 300s
    pull_policy: build
    expose:
    - '3000'
    labels:
      org.opencontainers.image.revision: 50be81e21a0b6646c1e6d7cca1a161e27e9aa8a4
      org.opencontainers.image.source: https://github.com/exodia-tech/pipeshub-ai
  mongodb:
    image: library/mongo@sha256:9814652e33f0cf8b9fddea8b46dfc9d8e19b130dcfdd7b510ca58bb0d40c8b71
    restart: always
    command:
    - mongod
    - --bind_ip_all
    - --wiredTigerCacheSizeGB
    - ${MONGO_CACHE_GB:-1}
    environment:
    - MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME:-admin}
    - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-}
    - GLIBC_TUNABLES=${MONGO_GLIBC_TUNABLES:-glibc.pthread.rseq=0}
    volumes:
    - mongodb_data:/data/db
    networks:
    - pipeshub
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1'
        reservations:
          memory: 512M
    healthcheck:
      test:
      - CMD
      - mongosh
      - --eval
      - db.adminCommand('ping')
      interval: 5s
      timeout: 3s
      retries: 5
  redis:
    image: library/redis@sha256:c6eabf748fc7a61dbb5a705c78bcf3d6377b1127a97d0ce965c11c44ba46896f
    restart: always
    command: 'sh -c "redis-server --appendonly yes --appendfsync everysec ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}"

      '
    volumes:
    - redis_data:/data
    networks:
    - pipeshub
    healthcheck:
      test:
      - CMD-SHELL
      - redis-cli --no-auth-warning ${REDIS_PASSWORD:+-a ${REDIS_PASSWORD}} ping | grep -q PONG
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
  qdrant:
    image: qdrant/qdrant@sha256:0fb8897412abc81d1c0430a899b9a81eb8328aa634e7242d1bc804c1fe8fe863
    stop_grace_period: 120s
    restart: always
    environment:
    - QDRANT__STORAGE__ON_DISK_PAYLOAD=true
    - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:-}
    - QDRANT__SERVICE__MAX_REQUEST_SIZE_MB=64
    - QDRANT__SERVICE__GRPC_PORT=6334
    - QDRANT__SERVICE__HTTP_PORT=6333
    - QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS=4
    - QDRANT__STORAGE__OPTIMIZERS__DEFAULT_SEGMENT_NUMBER=8
    - QDRANT__STORAGE__OPTIMIZERS__MEMMAP_THRESHOLD=10000
    - QDRANT__STORAGE__OPTIMIZERS__INDEXING_THRESHOLD_KB=20000
    - QDRANT__STORAGE__WAL__WAL_CAPACITY_MB=256
    - QDRANT__CLUSTER__CONSENSUS__MAX_MESSAGE_QUEUE_SIZE=1000
    volumes:
    - qdrant_storage:/qdrant/storage
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'
        reservations:
          cpus: '2'
          memory: 2G
    ulimits:
      nofile:
        soft: 50000
        hard: 50000
    networks:
    - pipeshub
    healthcheck:
      test:
      - CMD-SHELL
      - bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  neo4j:
    image: library/neo4j@sha256:5a015e53de1895e7eee1574ae0325cf8c4b89587222778108c594bdd45a474b5
    restart: always
    environment:
    - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-}
    - NEO4J_PLUGINS=["apoc"]
    - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    - NEO4J_dbms_memory_heap_initial__size=1G
    - NEO4J_dbms_memory_heap_max__size=2G
    - NEO4J_dbms_memory_pagecache_size=1G
    volumes:
    - neo4j_data:/data
    - neo4j_logs:/logs
    networks:
    - pipeshub
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'
        reservations:
          cpus: '2'
          memory: 2G
    healthcheck:
      test:
      - CMD-SHELL
      - wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  qdrant_storage:
    driver: local
  pipeshub_data:
    driver: local
  pipeshub_root_local:
    driver: local
  pipeshub_hf_cache:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
networks:
  pipeshub:
    driver: bridge
